name: TFM_Agentes

channels:
  - conda-forge
  - nodefaults

dependencies:
  # Python
  - python=3.11

  # Base científica y tratamiento de datos
  - numpy=2.4.6
  - pandas=3.0.5
  - requests=2.34.2

  # Validación, configuración y documentos
  - pydantic=2.13.4
  - python-dotenv=1.2.3
  - pypdf=6.14.2

  # Aplicación y visualización
  - flask=3.1.3
  - plotly=6.9.0

  # Jupyter
  - ipykernel=7.3.0

  # PyTorch con soporte GPU
  - pytorch=2.13.0
  - pytorch-gpu=2.13.0
  - cuda-version=12.9

  # Dependencias instaladas mediante pip
  - pip
  - pip:
      # Hugging Face y embeddings
      - sentence-transformers==5.7.0
      - transformers==5.15.1
      - huggingface-hub==1.28.0

      # Agentes y orquestación
      - langchain==1.3.16
      - langchain-core==1.6.0
      - langgraph==1.2.11
      - langchain-mistralai==1.1.6

      # Model Context Protocol (MCP)
      - mcp==1.29.1
      - langchain-mcp-adapters==0.3.2

      # RAG
      - llama-index-core==0.14.23
      - llama-index-embeddings-huggingface==0.7.0
